name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: 25.2.9519653
  SDL2_VERSION: 2.30.12
  LIBPNG_VERSION: 1.6.43
  LIBJPEG_TURBO_VERSION: 3.0.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;${NDK_VERSION}" "platforms;android-33" "build-tools;33.0.2" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > android/app/local.properties

      - name: Cache third-party sources
        id: deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-sdl${{ env.SDL2_VERSION }}-png${{ env.LIBPNG_VERSION }}-jpeg${{ env.LIBJPEG_TURBO_VERSION }}

      - name: Download third-party sources
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          mkdir -p deps && cd deps
          curl -fsSL "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz" | tar xz
          curl -fsSL "https://github.com/pnggroup/libpng/archive/refs/tags/v${LIBPNG_VERSION}.tar.gz" | tar xz
          curl -fsSL "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${LIBJPEG_TURBO_VERSION}/libjpeg-turbo-${LIBJPEG_TURBO_VERSION}.tar.gz" | tar xz

      - name: Build APK
        run: |
          export SDL2_SOURCE_DIR="$PWD/deps/SDL2-${SDL2_VERSION}"
          export LIBPNG_SOURCE_DIR="$PWD/deps/libpng-${LIBPNG_VERSION}"
          export LIBJPEG_TURBO_SOURCE_DIR="$PWD/deps/libjpeg-turbo-${LIBJPEG_TURBO_VERSION}"
          ./scripts/build_android.sh

      - name: Collect APK
        run: |
          NAME="muramasa-android-${GITHUB_REF_NAME//\//-}.apk"
          mkdir -p dist
          cp android/app/app/build/outputs/apk/debug/app-debug.apk "dist/$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: dist/${{ env.APK_NAME }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.APK_NAME }}
          generate_release_notes: true
          body: |
            《装甲悪鬼村正》Android 引擎移植版 APK（arm64-v8a + x86_64，debug 签名）。
            APK 不含任何游戏数据，需自行准备正版游戏文件，安装方法见 README。
